<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIA Organizer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f7a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LIA Organizer">
<style>
:root {
  --m50:#f4f9f0; --m100:#e4efe2; --m200:#d3e4cb; --m300:#9dbf8f;
  --m400:#5f9e4c; --m500:#3f8f2b; --m600:#2f7a1e; --m700:#1e6b3c;
  --m800:#7b4b2a; --m900:#4d2e17;
  --bg:#f4f9f0; --card:#ffffff; --text:#3b2a1a; --muted:#6b4e35;
  --border:#b9cfae; --shadow:0 4px 14px rgba(93,64,36,.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:linear-gradient(160deg,#f4f9f0 0%,#e8f0e4 50%,#d8e9e4 100%); min-height:100vh; color:var(--text); }
.container { max-width:1100px; margin:0 auto; padding:32px 16px 60px; }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:28px; }
h1 { font-size:1.9rem; color:var(--m700); }
.subtitle { color:var(--muted); font-size:.95rem; margin-top:2px; }
.btn { border:none; cursor:pointer; font-weight:600; padding:10px 18px; border-radius:10px; font-size:.95rem; transition:.15s; display:inline-flex; align-items:center; gap:6px; }
.ico { width:1em; height:1em; flex:0 0 auto; fill:currentColor; vertical-align:-0.125em; }
.btn-primary { background:var(--m600); color:#fff; }
.btn-primary:hover { background:var(--m700); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(47,122,30,.30); }
.btn-ghost { background:var(--m100); color:var(--m800); }
.btn-ghost:hover { background:var(--m200); }
.btn-danger { background:#fee2e2; color:#b91c1c; }
.btn-danger:hover { background:#fecaca; }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; align-items:center; }
.toolbar-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.toolbar-row.secondary { margin-left:auto; }
.period { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border:2px solid var(--border); border-radius:10px; background:var(--card); }
.period .icon { font-size:1rem; display:inline-flex; align-items:center; }
.period label { margin:0; }
.period input { width:150px; padding:4px 6px; border:none; border-radius:6px; font-size:.9rem; background:transparent; color:var(--text); outline:none; }
.period input:focus { border:none; box-shadow:none; }
.search { flex:1 1 100%; min-width:220px; position:relative; }
.search input { width:100%; padding:11px 14px 11px 40px; border:2px solid var(--border); border-radius:10px; background:var(--card); font-size:1rem; color:var(--text); outline:none; }
.search input:focus { border-color:var(--m500); box-shadow:0 0 0 3px rgba(63,143,43,.15); }
.search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; fill:var(--m400); }
select.sort { padding:11px 14px; border:2px solid var(--border); border-radius:10px; background:var(--card); font-size:.95rem; color:var(--text); outline:none; cursor:pointer; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
@media (min-width:900px){ .stats{grid-template-columns:repeat(6,1fr);} }
.stat { background:var(--card); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); border-left:4px solid var(--stat-color,var(--m600)); display:flex; flex-direction:column; gap:2px; min-width:0; }
.stat .num { font-size:1.7rem; font-weight:800; color:var(--stat-color,var(--m700)); line-height:1.1; }
.stat .lbl { font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:900px){ .chart{display:none;} }
.stat.total { --stat-color:var(--m700); }
.stat.pending { --stat-color:#a16207; }
.stat.interview { --stat-color:#4338ca; }
.stat.yes { --stat-color:#15803d; }
.stat.no { --stat-color:#b91c1c; }
.stat.notsent { --stat-color:#b45309; }
.chart { background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:28px; }
.chart-title { font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px; }
.bar { display:flex; height:28px; border-radius:8px; overflow:hidden; background:var(--m50); position:relative; }
.seg { min-width:10px; transition:filter .15s; cursor:pointer; }
.seg:hover { filter:brightness(1.1); }
.seg.c-notsent { background:#d97706; }
.seg.c-sent { background:#2f7a1e; }
.seg.c-interview { background:#1d4ed8; }
.seg.c-yes { background:#15803d; }
.seg.c-no { background:#b91c1c; }
.seg.c-wait { background:#d9a441; }
.seg-label { position:fixed; background:#3b2a1a; color:#fff; font-size:.8rem; padding:6px 10px; border-radius:8px; pointer-events:none; opacity:0; transition:opacity .12s; z-index:98; white-space:nowrap; }
.seg-label::after { content:''; position:absolute; bottom:-5px; left:14px; border-width:5px 5px 0 5px; border-style:solid; border-color:#3b2a1a transparent transparent transparent; }
.seg-label.show { opacity:1; }
.chart-legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:.75rem; color:var(--muted); }
.legend-item { display:inline-flex; align-items:center; gap:5px; }
.legend-dot { width:10px; height:10px; border-radius:3px; display:inline-block; }
@media (max-width:560px){ .stats{gap:6px;} .stat{padding:10px 8px; border-left-width:4px;} .stat .num{font-size:1.35rem;} .stat .lbl{font-size:.54rem; letter-spacing:.3px;} }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; margin-top:16px; }
@media (max-width:560px){
  .filters { flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .filters .chip { flex:0 0 auto; }
}
.list-header { display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; margin-bottom:16px; }
.filter-status { font-size:.85rem; color:var(--muted); margin-bottom:10px; display:none; }
.filter-status.show { display:block; }
.filter-status button { background:none; border:none; color:var(--m600); font-weight:700; cursor:pointer; font-size:.85rem; text-decoration:underline; padding:0; }
.list-title { font-size:1.35rem; font-weight:800; color:var(--m700); margin-right:2px; }
.list-header .toolbar-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.chip { padding:6px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--card); color:var(--muted); font-size:.85rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.15s; }
.chip:hover { border-color:var(--m400); color:var(--m700); }
.chip .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.chip.active { background:var(--m600); border-color:var(--m600); color:#fff; }
.chip-count { font-weight:700; font-size:.72rem; background:rgba(0,0,0,.07); border-radius:999px; padding:1px 7px; margin-left:2px; }
.chip.active .chip-count { background:rgba(255,255,255,.25); }
.card { background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:18px; margin-bottom:14px; border:1px solid var(--m100); border-left:5px solid var(--card-color,var(--m300)); transition:.15s; }
.card.o-notsent { --card-color:#d97706; }
.card.o-wait { --card-color:#d9a441; }
.card.o-interview { --card-color:#1d4ed8; }
.card.o-yes { --card-color:#15803d; }
.card.o-no { --card-color:#b91c1c; }
.card:hover { box-shadow:0 6px 20px rgba(93,64,36,.16); }
.card-head { display:flex; align-items:center; gap:12px; cursor:pointer; flex-wrap:wrap; }
.card-head .company { flex:1 1 auto; min-width:120px; }
.site-link { font-size:.8rem; font-weight:400; color:var(--m600); text-decoration:none; margin-left:6px; border-bottom:1px solid var(--m300); }
.site-link:hover { color:var(--m500); }
.head-badges { display:flex; gap:6px; flex-wrap:wrap; }
.toggle { margin-left:auto; background:none; border:none; cursor:pointer; font-size:1.1rem; color:var(--m600); transition:transform .15s; }
.card.collapsed .toggle { transform:rotate(-90deg); }
.card-details { }
.card.collapsed .card-details { display:none; }
.card:not(.collapsed) .head-badges .b-type { display:none; }
.company { font-size:1.25rem; font-weight:700; color:var(--m700); }
.company a { color:inherit; text-decoration:none; border-bottom:2px solid var(--m300); }
.company a:hover { color:var(--m600); }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 0; }
.badge { font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.5px; }
.b-pending { background:#f3f4f6; color:#4b5563; }
.b-yes { background:#dcfce7; color:#15803d; }
.b-no { background:#fee2e2; color:#b91c1c; }
.b-status { background:var(--m100); color:var(--m700); }
.b-deadline { background:#fef3c7; color:#b45309; }
.b-deadline-over { background:#fee2e2; color:#b91c1c; }
.b-followup { background:#e0e7ff; color:#4338ca; }
.b-status-red { background:#fee2e2; color:#b91c1c; }
.b-type { background:#f3f4f6; color:#4b5563; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px 18px; margin-top:16px; font-size:.92rem; }
.grid .lbl { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.4px; display:block; }
.grid .val { color:var(--text); }
.notes { margin-top:16px; font-size:.9rem; color:var(--muted); background:var(--m50); border-radius:8px; padding:10px 12px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; max-width:100%; }
.card-actions { display:flex; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--m100); flex-wrap:wrap; align-items:center; }
.icon-btn { background:var(--m50); border:none; cursor:pointer; padding:9px; border-radius:9px; color:var(--m700); display:inline-flex; align-items:center; transition:.15s; }
.icon-btn:hover { background:var(--m100); color:var(--m600); }
.actions-secondary { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty h3 { color:var(--m700); font-size:1.2rem; margin-bottom:6px; }
.empty p { margin-bottom:18px; }
.empty-ico { width:48px; height:48px; fill:var(--m300); margin-bottom:14px; }
.empty-link { background:none; border:none; color:var(--m600); font-weight:700; text-decoration:underline; cursor:pointer; font-size:inherit; padding:0; }
dialog { border:none; border-radius:16px; padding:0; width:min(640px,94vw); box-shadow:0 20px 60px rgba(59,42,26,.25); }
dialog::backdrop { background:rgba(59,42,26,.35); backdrop-filter:blur(2px); }
.modal-content { background:linear-gradient(180deg,#fff,#eef5ea); border-radius:16px; padding:24px; max-height:88vh; overflow:auto; }
.modal-content h2 { color:var(--m700); margin-bottom:16px; font-size:1.3rem; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-grid .full { grid-column:1/-1; }
label { display:block; font-size:.78rem; font-weight:700; color:var(--m700); text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
input, textarea { width:100%; padding:10px 12px; border:2px solid var(--border); border-radius:9px; font-size:.95rem; font-family:inherit; color:var(--text); background:#fff; outline:none; }
input:focus, textarea:focus { border-color:var(--m500); box-shadow:0 0 0 3px rgba(63,143,43,.15); }
select:disabled, input:disabled { opacity:.55; cursor:not-allowed; background:#f3f4f6; }
textarea { resize:vertical; min-height:70px; }
.modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
.hint { font-size:.8rem; color:var(--muted); margin-top:14px; text-align:center; }
.import-mode { display:flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600; color:var(--muted); text-transform:none; letter-spacing:0; cursor:pointer; margin-left:8px; }
.import-mode input { width:auto; padding:0; accent-color:var(--m600); }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:#7b4b2a; color:#fff; padding:12px 22px; border-radius:999px; font-size:.9rem; opacity:0; transition:.3s; z-index:99; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
@media (max-width:560px){ .form-grid{grid-template-columns:1fr;} h1{font-size:1.5rem;} .btn .btn-txt{display:none;} header .btn{padding:10px 12px;} }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1><svg class="ico" viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg> LIA Organizer</h1>
      <div class="subtitle">Håll koll på dina LIA-ansökningar – allt sparas lokalt i din webbläsare.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="exportBtn" title="Spara alla ansökningar som en JSON-fil"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> <span class="btn-txt">Exportera</span></button>
      <button class="btn btn-ghost" id="importBtn" title="Läs in ansökningar från en JSON-fil"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h14v2H5V4zm0 6h4v11h6V10h4l-7-7-7 7z"/></svg> <span class="btn-txt">Importera</span></button>
      <button class="btn btn-ghost" id="exportCsvBtn" title="Spara alla ansökningar som en CSV-fil (Excel/Sheets)"><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 15h8v2H8v-2zm0-4h8v2H8v-2z"/></svg> <span class="btn-txt">CSV</span></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
  <label class="import-mode"><input type="checkbox" id="importReplace"> Ersätt befintliga vid import (avmarkerat = lägg till)</label>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="chart" id="chart" hidden>
    <div class="chart-title">Statusfördelning</div>
    <div class="bar" id="statusBar"></div>
    <div class="chart-legend" id="chartLegend"></div>
  </div>
  <div class="seg-label" id="segLabel"></div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="search" type="search" placeholder="Sök företag, kontakt, stad, status…" autocomplete="off">
    </div>
    <div class="toolbar-row">
    <select class="sort" id="sort">
      <option value="date-desc">Ansökningsdatum ↓ (nyast först)</option>
      <option value="date-asc">Ansökningsdatum ↑ (äldst först)</option>
      <option value="company-asc">Företag A–Ö</option>
      <option value="company-desc">Företag Ö–A</option>
      <option value="updated-desc">Senast ändrad</option>
    </select>
    <div class="period" title="Din LIA-period – gäller alla ansökningar">
      <span class="icon"><svg class="ico" viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg></span><label for="period">LIA-period</label>
      <input id="period" placeholder="t.ex. vt 2026">
    </div>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="filter-status" id="filterStatus"></div>
  <div class="list-header"><span class="list-title">Ansökningar</span>
    <button class="btn btn-primary" id="addBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> <span class="btn-txt">Ny ansökan</span></button>
    <button class="btn btn-ghost" onclick="setAllCollapsed(false)" title="Visa alla detaljer"><svg class="ico" viewBox="0 0 24 24"><path d="M12 16l-6-6h12l-6 6z"/></svg> Visa alla</button>
    <button class="btn btn-ghost" onclick="setAllCollapsed(true)" title="Minimera alla detaljer"><svg class="ico" viewBox="0 0 24 24"><path d="M6 8l6 6 6-6H6z"/></svg> Minimera alla</button>
  </div>
  <div id="list"></div>
  <p class="hint"><svg class="ico" viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9zm3 4a2 2 0 0 1 1 3.7V18h-2v-1.3A2 2 0 0 1 12 13z"/></svg> Allt sparas endast på din enhet (localStorage). Ingen data skickas till någon server – andra användare ser aldrig dina ansökningar.</p>
</div>

<dialog id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Ny ansökan</h2>
    <form id="form" autocomplete="off">
      <input type="hidden" id="id">
      <div class="form-grid">
        <div class="full"><label for="company">Företagsnamn *</label><input id="company" required maxlength="100"></div>
        <div><label for="applyDate">Ansökningsdatum</label><input id="applyDate" type="date"></div>
        <div><label for="deadline">Sista ansökningsdag</label><input id="deadline" type="date"></div>
        <div class="full"><label for="website">Länk till företagets webbplats</label><input id="website" type="url" placeholder="https://…"></div>
        <div><label for="status">Status</label>
          <select id="status" class="sort" style="width:100%">
            <option value="Inte skickad">Inte skickad</option>
            <option value="Skickad">Skickad</option>
            <option value="Intervju">Intervju bokad</option>
            <option value="Klar">Avslutad</option>
          </select>
        </div>
        <div><label for="answer">Svar från företaget</label>
          <select id="answer" class="sort" style="width:100%">
            <option value="pending">Väntar på svar</option>
            <option value="yes">Ja (positivt)</option>
            <option value="no">Nej (avslag)</option>
          </select>
        </div>
        <div><label for="answerDate">Svarsdatum</label><input id="answerDate" type="date"></div>
        <div><label for="city">Ort</label><input id="city" placeholder="t.ex. Stockholm"></div>
        <div><label for="businessType">Verksamhetstyp</label>
          <select id="businessType" class="sort" style="width:100%">
            <option value="">– Välj –</option>
            <option value="consult">Konsultbolag</option>
            <option value="product">Produktbolag</option>
            <option value="public">Offentlig</option>
          </select>
        </div>
        <div class="full"><label>Kontakt på företaget</label></div>
        <div><label for="contactName">Namn</label><input id="contactName"></div>
        <div><label for="contactTitle">Titel</label><input id="contactTitle" placeholder="t.ex. HR-specialist"></div>
        <div><label for="contactEmail">E-post</label><input id="contactEmail" type="email"></div>
        <div><label for="contactPhone">Telefon</label><input id="contactPhone" type="tel"></div>
        <div class="full"><label for="notes">Anteckningar</label><textarea id="notes" placeholder="Minnesanteckningar, nästa steg, länk till annons…"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Avbryt</button>
        <button type="submit" class="btn btn-primary"><svg class="ico" viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-9h-4V5h4v5z"/></svg> Spara</button>
      </div>
    </form>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'lia-applications-v1';
const $ = id => document.getElementById(id);
let apps = [];
const COLLAPSE_KEY = 'lia-collapsed';
const PERIOD_KEY = 'lia-period';
const BACKUP_KEY = 'lia-last-backup';
const VIEW_KEY = 'lia-view';
let collapsed = new Set();
let filter = 'all';

const STATUS_ICON = {yes:'✅', no:'❌', pending:'⏳'};
const STATUSES = ['Inte skickad','Skickad','Intervju','Klar'];

function load(){ try{ apps = JSON.parse(localStorage.getItem(KEY)) || []; } catch{ apps = []; } try{ collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || []); } catch{ collapsed = new Set(); } }
function saveCollapsed(){ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed])); }
function loadPeriod(){ $('period').value = localStorage.getItem(PERIOD_KEY) || ''; }
function savePeriod(){ localStorage.setItem(PERIOD_KEY, $('period').value.trim()); }
function saveView(){ localStorage.setItem(VIEW_KEY, JSON.stringify({ q:$('search').value, sort:$('sort').value, filter })); }
function loadView(){
  let v; try{ v = JSON.parse(localStorage.getItem(VIEW_KEY)) || {}; } catch{ v = {}; }
  if (v.q) $('search').value = v.q;
  if (v.sort) $('sort').value = v.sort;
  if (v.filter) filter = v.filter;
}
function toggleCard(id){ const el=$('card-'+id); if(!el) return; if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); saveCollapsed(); el.classList.toggle('collapsed', collapsed.has(id)); }
function setAllCollapsed(v){ apps.forEach(a => { if(v) collapsed.add(a.id); else collapsed.delete(a.id); }); saveCollapsed(); render(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(apps)); }
function checkBackupReminder(){
  if (!apps.length) return;
  const last = localStorage.getItem(BACKUP_KEY);
  const threshold = Date.now() - 14 * 86400000;
  if (!last || Number(last) < threshold){
    toast('Tips: exportera en s\u00e4kerhetskopia av dina ans\u00f6kningar');
    localStorage.setItem(BACKUP_KEY, String(Date.now()));
  }
}
function markBackupDone(){ localStorage.setItem(BACKUP_KEY, String(Date.now())); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function matches(a, q){
  q = q.toLowerCase();
  return [a.company,a.city,typeLabel(a.businessType),a.notes,a.status,a.contactName,a.contactTitle,a.contactEmail,a.contactPhone]
    .some(v => String(v||'').toLowerCase().includes(q));
}

function passFilter(a){
  if (filter === 'all') return true;
  if (filter === 'yes' || filter === 'no' || filter === 'pending') return a.answer === filter;
  return a.status === filter;
}

function sortApps(list){
  const s = $('sort').value;
  const byDate = (a,b) => (b.applyDate||'').localeCompare(a.applyDate||'');
  const cmp = {
    'date-desc': byDate,
    'date-asc': (a,b)=>byDate(b,a),
    'company-asc': (a,b)=>(a.company||'').localeCompare(b.company||'','sv'),
    'company-desc': (a,b)=>(a.company||'').localeCompare(b.company||'','sv') * -1,
    'updated-desc': (a,b)=>(b.updated||'').localeCompare(a.updated||'')
  };
  return list.sort(cmp[s]);
}

function render(){
  const q = $('search').value.trim();
  const list = sortApps(apps.filter(a => matches(a,q) && passFilter(a)));

  const total = apps.length;
  const yes = apps.filter(a=>outcome(a)==='Ja').length;
  const no = apps.filter(a=>outcome(a)==='Nej').length;
  const pending = apps.filter(a=>outcome(a)==='Väntar svar').length;
  const interviews = apps.filter(a=>outcome(a)==='Intervju').length;
  const notsent = apps.filter(a=>(a.status||'Skickad')==='Inte skickad').length;
  $('stats').innerHTML = [
    [total,'Totalt','total'], [notsent,'Ej skickad','notsent'],
    [pending,'Väntar svar','pending'], [interviews,'Intervjuer','interview'],
    [yes,'Ja','yes'], [no,'Nej','no']
  ].map(([n,l,c])=>`<div class="stat ${c}"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');
  renderChart();

  const CHIP_DOTS = {'pending':'#d9a441','yes':'#15803d','no':'#b91c1c','Inte skickad':'#d97706','Skickad':'#2f7a1e','Intervju':'#1d4ed8','Klar':'#6b7280'};
  const chipCount = v => v==='all' ? apps.length
    : (v==='pending'||v==='yes'||v==='no') ? apps.filter(a=>a.answer===v).length
    : apps.filter(a=>(a.status||'Skickad')===v).length;
  const chips = [['all','Alla'],['pending','Väntar'],['yes','Ja'],['no','Nej'],...STATUSES.map(s=>[s,s])];
  $('filters').innerHTML = chips.map(([v,l]) =>
    `<button class="chip ${filter===v?'active':''}" data-f="${v}">${CHIP_DOTS[v]?`<span class="dot" style="background:${CHIP_DOTS[v]}"></span>`:''}${l}<span class="chip-count">${chipCount(v)}</span></button>`).join('');

  const fs = $('filterStatus');
  if (filter !== 'all' || q){
    const label = filter === 'all' ? 'Alla' : (filter === 'pending' ? 'V\u00e4ntar' : filter === 'yes' ? 'Ja' : filter === 'no' ? 'Nej' : filter);
    const parts = [];
    if (filter !== 'all') parts.push(`Filtrerar p\u00e5: ${label}`);
    if (q) parts.push(`S\u00f6kning: "${esc(q)}"`);
    fs.innerHTML = `${parts.join(' + ')} \u2013 visar ${list.length} av ${total} <button onclick="clearFilters()">Rensa</button>`;
    fs.classList.add('show');
  } else {
    fs.classList.remove('show');
  }
  if (!list.length){
    $('list').innerHTML = total
      ? `<div class="empty"><h3>Inga träffar</h3><p>Prova att ändra sökning eller filter – eller <button class="empty-link" onclick="clearFilters()">rensa filtret</button>.</p></div>`
      : `<div class="empty"><svg class="empty-ico" viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg><h3>Inga ansökningar än</h3><p>Spåra ditt LIA-sökande här – status, kontakter och deadlines på ett ställe.</p><button class="btn btn-primary" onclick="openModal()"><svg class="ico" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Skapa din första ansökan</button></div>`;
    return;
  }
  const contactShort = a => {
    const parts = [];
    if (a.contactName) parts.push(esc(a.contactName) + (a.contactTitle ? ` <small>(${esc(a.contactTitle)})</small>` : ''));
    if (a.contactEmail) parts.push(`<a href="mailto:${esc(a.contactEmail)}">${esc(a.contactEmail)}</a>`);
    if (a.contactPhone) parts.push(esc(a.contactPhone));
    return parts.join('<br>') || '—';
  };
  const OUTCOME_CLS = {'Inte skickad':'o-notsent','V\u00e4ntar svar':'o-wait','Intervju':'o-interview','Ja':'o-yes','Nej':'o-no'};
  const deadlineBadge = a => {
    if (!a.deadline || outcome(a) !== 'Inte skickad') return '';
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(a.deadline + 'T00:00:00');
    const days = Math.round((d - today) / 86400000);
    if (days < 0) return '<span class="badge b-deadline-over">Passerad deadline</span>';
    if (days <= 7) return `<span class="badge b-deadline">${days === 0 ? 'Deadline idag!' : days + ' dagar kvar'}</span>`;
    return '';
  };
  const followUpBadge = a => {
    if (a.answer !== 'pending' || outcome(a) !== 'V\u00e4ntar svar' || !a.applyDate) return '';
    const sent = new Date(a.applyDate + 'T00:00:00');
    const days = Math.round((Date.now() - sent) / 86400000);
    if (days >= 21) return '<span class="badge b-followup">Dags att f\u00f6lja upp?</span>';
    return '';
  };
  $('list').innerHTML = list.map(a=>{
    const ans = a.answer==='pending' ? '<span class="badge b-pending">Väntar på svar</span>'
      : a.answer==='yes' ? '<span class="badge b-yes">Ja</span>' : '<span class="badge b-no">Nej</span>';
    const siteShort = a.website ? esc(a.website.replace(/^https?:\/\//,'').replace(/\/$/,'').split('/')[0]) : '';
    return `<div class="card ${collapsed.has(a.id)?'collapsed':''} ${OUTCOME_CLS[outcome(a)]}" id="card-${a.id}">
      <div class="card-head" onclick="toggleCard('${a.id}')" title="Klicka för att visa/minimera detaljer">
        <div class="company">${esc(a.company)}${siteShort?` <a class="site-link" href="${esc(a.website)}" target="_blank" rel="noopener" title="${esc(a.website)}">${siteShort}</a>`:''}</div>
        <div class="head-badges">${deadlineBadge(a)}${followUpBadge(a)}<span class="badge b-status ${a.status==='Inte skickad'?'b-status-red':''}">${esc(a.status||'Skickad')}</span>${a.businessType?`<span class="badge b-type">${typeLabel(a.businessType)}</span>`:''}</div>
        <button class="toggle" aria-label="Visa/minimera detaljer">▾</button>
      </div>
      <div class="card-details">
      <div class="badges">${a.businessType?`<span class="badge b-type">${typeLabel(a.businessType,true)}</span>`:''}${ans}${a.answerDate?`<span class="badge b-pending">Svar: ${esc(a.answerDate)}</span>`:''}</div>
      <div class="grid">
        <div><span class="lbl">Ansökningsdatum</span><span class="val">${esc(a.applyDate)||'—'}</span></div>
        <div><span class="lbl">Sista ansökningsdag</span><span class="val">${esc(a.deadline)||'—'}</span></div>
        <div><span class="lbl">Ort</span><span class="val">${esc(a.city)||'—'}</span></div>
        <div><span class="lbl">Kontakt</span><span class="val">${contactShort(a)}</span></div>
      </div>
      ${a.notes?`<div class="notes">${esc(a.notes)}</div>`:''}
      <div class="card-actions">
        <button class="btn btn-ghost" onclick="editApp('${a.id}')"><svg class="ico" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Redigera</button>
        <button class="btn btn-danger" onclick="delApp('${a.id}')"><svg class="ico" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Ta bort</button>
        <div class="actions-secondary">
        <button class="icon-btn" title="Sök företaget på Google" onclick="webSearch('${a.id}','google')"><svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
        <button class="icon-btn" title="Sök företagets LinkedIn-sida" onclick="webSearch('${a.id}','linkedin')"><svg class="ico" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 18.34V11.3H5.99v7.04h2.35zM7.16 9.91a1.35 1.35 0 1 0 0-2.7 1.35 1.35 0 0 0 0 2.7zM18.34 18.34v-4.03c0-2.2-1.17-3.22-2.74-3.22-1.26 0-1.83.7-2.14 1.18v-1.02H11.1c.03.67 0 7.09 0 7.09h2.36v-3.96c0-.21.02-.42.08-.57.17-.42.55-.86 1.2-.86.85 0 1.19.65 1.19 1.6v3.79h2.41z"/></svg></button>
        <button class="icon-btn" title="Sök företagets adress och telefonnummer" onclick="webSearch('${a.id}','maps')"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></button>
        <button class="icon-btn" title="Duplicera ansökan" onclick="dupApp('${a.id}')"><svg class="ico" viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg></button>
        </div>
      </div>
      </div>
    </div>`;
  }).join('');
}

function openModal(id){
  const a = id ? apps.find(x=>x.id===id) : null;
  $('modalTitle').textContent = a ? 'Redigera ansökan' : 'Ny ansökan';
  $('id').value = a ? a.id : '';
  for (const f of ['company','applyDate','deadline','website','status','answer','answerDate','city','businessType','contactName','contactTitle','contactEmail','contactPhone','notes'])
    $(f).value = a ? (a[f] ?? '') : '';
  if (!a) { $('answer').value = 'pending'; $('status').value = 'Inte skickad'; }
  syncAnswerLock();
  $('modal').showModal();
}
function editApp(id){ openModal(id); }

function webSearch(id, engine){
  const a = apps.find(x=>x.id===id);
  if (!a || !a.company){ toast('Fyll i ett företagsnamn först'); return; }
  const q = encodeURIComponent(a.company);
  const urls = {
    google: 'https://www.google.com/search?q=' + q,
    linkedin: 'https://www.linkedin.com/search/results/companies/?keywords=' + q,
    maps: 'https://www.google.com/maps/search/' + q
  };
  window.open(urls[engine], '_blank', 'noopener');
}
function dupApp(id){
  const a = apps.find(x=>x.id===id); if(!a) return;
  apps.unshift({...a, id:uid(), company:a.company+' (kopia)', updated:new Date().toISOString()});
  save(); render(); toast('Ansökan duplicerad');
}
const pendingDelete = new Set();
function delApp(id){
  const a = apps.find(x=>x.id===id); if(!a) return;
  const btn = document.querySelector(`#card-${id} .btn-danger`);
  if (!pendingDelete.has(id)){
    pendingDelete.add(id);
    if (btn){ btn.classList.add('confirm'); btn.lastChild.textContent = ' Säker?'; }
    setTimeout(() => { pendingDelete.delete(id); if (btn){ btn.classList.remove('confirm'); btn.lastChild.textContent = ' Ta bort'; } }, 3000);
    return;
  }
  pendingDelete.delete(id);
  apps = apps.filter(x=>x.id!==id);
  save(); render(); toast('Ansökan borttagen');
}

function syncAnswerLock(){
  const locked = $('status').value === 'Inte skickad';
  $('answer').disabled = locked;
  $('answerDate').disabled = locked;
  if (locked){ $('answer').value = 'pending'; $('answerDate').value = ''; }
}
$('status').addEventListener('change', syncAnswerLock);

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const id = $('id').value;
  const data = {
    id: id || uid(), updated: new Date().toISOString()
  };
  for (const f of ['company','applyDate','deadline','website','status','answer','answerDate','city','businessType','contactName','contactTitle','contactEmail','contactPhone','notes'])
    data[f] = $(f).value.trim();
  if (data.status === 'Inte skickad'){ data.answer = 'pending'; data.answerDate = ''; }
  else if (data.answer === 'pending') data.answerDate = '';
  const i = apps.findIndex(x=>x.id===data.id);
  if (i >= 0) apps[i] = data; else apps.unshift(data);
  save(); $('modal').close(); render();
  toast(id ? 'Ansökan uppdaterad ✔' : 'Ansökan sparad ✔');
});

$('addBtn').onclick = () => openModal();

function exportJSON(){
  if (!apps.length){ toast('Inget att exportera ännu'); return; }
  const data = { app:'lia-organizer', version:1, exported:new Date().toISOString(), applications:apps };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lia-ansokningar-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exporterade ' + apps.length + ' ansökningar ✔');
  markBackupDone();
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { toast('Ogiltig JSON-fil'); return; }
    const incoming = Array.isArray(data) ? data : data.applications;
    if (!Array.isArray(incoming)){ toast('Filen innehåller inga ansökningar'); return; }
    const valid = incoming.filter(a => a && a.company).map(a => ({...a, id:a.id||uid()}));
    if (!valid.length){ toast('Filen innehåller inga giltiga ansökningar'); return; }
    const replace = apps.length ? $('importReplace').checked : true;
    if (replace) apps = valid;
    else {
      const existing = new Set(apps.map(a=>a.id));
      for (const a of valid){
        if (existing.has(a.id)) a.id = uid();
        apps.push(a);
      }
    }
    save(); render();
    toast('Importerade ' + valid.length + ' ansökningar ✔');
  };
  reader.readAsText(file);
}

function exportCSV(){
  if (!apps.length){ toast('Inget att exportera ännu'); return; }
  const fields = ['company','applyDate','deadline','website','status','answer','answerDate','city','businessType','contactName','contactTitle','contactEmail','contactPhone','notes'];
  const csvCell = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const rows = [fields.join(',')].concat(apps.map(a => fields.map(f => csvCell(a[f])).join(',')));
  const blob = new Blob(['\uFEFF' + rows.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url;
  el.download = 'lia-ansokningar-' + new Date().toISOString().slice(0,10) + '.csv';
  el.click();
  URL.revokeObjectURL(url);
  toast('Exporterade ' + apps.length + ' ansökningar som CSV ✔');
  markBackupDone();
}
$('exportBtn').onclick = exportJSON;
$('exportCsvBtn').onclick = exportCSV;
$('importBtn').onclick = () => $('importFile').click();
$('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) importJSON(f);
  e.target.value = '';
});
$('cancelBtn').onclick = () => $('modal').close();
$('modal').addEventListener('close', () => $('form').reset());
$('search').addEventListener('input', () => { saveView(); render(); });
$('sort').addEventListener('change', () => { saveView(); render(); });
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  filter = b.dataset.f; saveView(); render();
});

function clearFilters(){ filter = 'all'; $('search').value = ''; saveView(); render(); }
$('period').addEventListener('input', savePeriod);
loadPeriod(); loadView();
function typeLabel(t, withIcon){
  const map = {consult:['Konsultbolag','🤝'], product:['Produktbolag','📦'], public:['Offentlig','🏛️']};
  const m = map[t];
  if (!m) return t || '';
  return withIcon ? m[1] + ' ' + m[0] : m[0];
}
function outcome(a){
  if ((a.status||'Skickad')==='Inte skickad') return 'Inte skickad';
  if (a.answer==='no') return 'Nej';
  if (a.answer==='yes') return 'Ja';
  if (a.status==='Intervju') return 'Intervju';
  return 'Väntar svar';
}
function renderChart(){
  const OUTCOMES = ['Inte skickad','Väntar svar','Intervju','Ja','Nej'];
  const cls = {'Inte skickad':'c-notsent','Väntar svar':'c-wait','Intervju':'c-interview','Ja':'c-yes','Nej':'c-no'};
  const colors = {'Inte skickad':'#d97706','Väntar svar':'#d9a441','Intervju':'#1d4ed8','Ja':'#15803d','Nej':'#b91c1c'};
  const counts = Object.fromEntries(OUTCOMES.map(o => [o, 0]));
  for (const a of apps) counts[outcome(a)]++;
  const sum = apps.length;
  const chart = $('chart'); const bar = $('statusBar'); const legend = $('chartLegend');
  if (!sum){ chart.hidden = true; return; }
  chart.hidden = false;
  bar.innerHTML = OUTCOMES.filter(o => counts[o]>0).map(o =>
    `<div class="seg ${cls[o]}" data-name="${esc(o)}" data-count="${counts[o]}" data-pct="${(counts[o]/sum*100).toFixed(1)}" style="width:${(counts[o]/sum*100).toFixed(2)}%" role="button" tabindex="0" aria-label="${esc(o)}: ${counts[o]}"></div>`).join('');
  legend.innerHTML = OUTCOMES.map(o =>
    `<span class="legend-item"><span class="legend-dot" style="background:${colors[o]}"></span>${esc(o)} (${counts[o]})</span>`).join('');
}
function showSegLabel(seg, ev){
  const t = $('segLabel');
  t.textContent = `${seg.dataset.name}: ${seg.dataset.count} st (${seg.dataset.pct}%)`;
  t.classList.add('show');
  const pad = 10, r = t.getBoundingClientRect();
  let x = (ev.clientX ?? window.innerWidth/2) + pad, y = (ev.clientY ?? 0) + pad;
  if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideSegLabel(){ $('segLabel').classList.remove('show'); }
function bindChartEvents(){
  const bar = $('statusBar');
  bar.addEventListener('mouseover', e => { const s = e.target.closest('.seg'); if(s) showSegLabel(s, e); });
  bar.addEventListener('mousemove', e => { const s = e.target.closest('.seg'); if(s) showSegLabel(s, e); else hideSegLabel(); });
  bar.addEventListener('mouseleave', hideSegLabel);
  bar.addEventListener('click', e => { const s = e.target.closest('.seg'); if(s) showSegLabel(s, e); });
  document.addEventListener('click', e => { if(!e.target.closest('.seg')) hideSegLabel(); });
}
bindChartEvents();

load(); render(); checkBackupReminder();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
